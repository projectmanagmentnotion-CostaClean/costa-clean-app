name: Costa Clean V3 Release Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [release/costa-clean-v3-integrated-20261009]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: costa-clean-v3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-risk:
    name: Change risk classification
    runs-on: ubuntu-latest
    outputs:
      level: ${{ steps.classify.outputs.level }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: classify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base_sha="$PR_BASE_SHA"
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha="$PUSH_BEFORE_SHA"
          fi
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha="$(git merge-base origin/main HEAD)"
          fi
          node scripts/release/classify-change-risk.mjs --base "$base_sha" --github-output "$GITHUB_OUTPUT"

  lint-and-build:
    name: Linux — Lint / TypeScript / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  linux-app-tests:
    needs: change-risk
    if: needs.change-risk.outputs.level != 'L1'
    name: Linux — App and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Native Windows CMD/psql QA contracts are tested in full on Windows.
      # This Linux job checks the actual app/API without relaxing assertions.
      - run: npm test -- src/ api/ --reporter=default

  full-windows-suite:
    needs: change-risk
    if: needs.change-risk.outputs.level != 'L1'
    name: Windows — Full suite including CP2B frozen QA proofs
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test -- --reporter=default
