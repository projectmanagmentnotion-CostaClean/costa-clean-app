name: CP-4.3C validation

on:
  push:
    branches:
      - codex/cp43c-qa-certified-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: CP-4.3C regression tests
        run: >
          npm exec vitest run --config vitest.config.mjs
          scripts/client-portal/transactionalEmail.test.mjs
          scripts/client-portal/portalHandler.test.mjs
          scripts/client-portal/portalInvitationDeliveryWorker.test.mjs
          scripts/client-portal/portalContract.test.mjs

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Full legacy suite diagnostic
        continue-on-error: true
        run: npm test
