name: Critical release verification (L3, no deployment)

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: risk
        run: node scripts/release/classify-change-risk.mjs --base "${{ github.event.pull_request.base.sha }}" --github-output "$GITHUB_OUTPUT"
      - if: steps.risk.outputs.level == 'L3'
        run: |
          npm run lint
          npm run build
          npm test
      - if: steps.risk.outputs.level == 'L3'
        run: node scripts/release/check-critical-evidence.mjs
      - if: steps.risk.outputs.level != 'L3'
        run: echo "No L3 changes; Critical Release certification is not applicable."
